name: Generate DuoPlay subtitles

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'DuoPlay streams to inspect this run'
        required: false
        default: '300'
  schedule:
    - cron: '45 6 * * *'

concurrency:
  group: pengu-repository-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build plain WebVTT tracks from DuoPlay HLS subtitles
        env:
          SUBTITLE_BATCH_SIZE: ${{ github.event.inputs.batch_size || '300' }}
        run: python scripts/generate_duoplay_subtitles.py
      - name: Add TV compatible HLS subtitle variants
        run: python scripts/generate_duoplay_hls_subtitles.py
      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- subtitles playlists stream subtitle-state.json
          if git diff --staged --quiet; then
            echo "No subtitle changes"
            exit 0
          fi
          git commit -m "chore: update DuoPlay subtitles"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
