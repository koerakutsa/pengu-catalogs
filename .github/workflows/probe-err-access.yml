name: Probe ERR access

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ERR response codes from GitHub runner
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          urls = {
              'api': 'https://services.err.ee/api/v2/vodContent/getContentPageData?contentId=1610141924&rootId=3905&page=web',
              'official_vtt': 'https://services.err.ee/subtitles/file/443152/443152_ET.vtt',
              'hls_master': 'https://vod.err.ee/hls/gbsec/e664391e5e26d70025a636c4e8f39dd6/2/v/PGEST/master.m3u8',
              'hls_nosub': 'https://vod.err.ee/hls/gbsec/e664391e5e26d70025a636c4e8f39dd6/2/v/nosub/PGEST/master.m3u8',
              'hls_subtitles': 'https://vod.err.ee/hls/gbsec/e664391e5e26d70025a636c4e8f39dd6/2/v/PGEST/index-f4.m3u8',
          }
          for name, url in urls.items():
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; PenguCatalogs/2.0)',
                  'Referer': 'https://jupiter.err.ee/',
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print(name, response.status)
              except urllib.error.HTTPError as exc:
                  print(name, exc.code)
              except Exception as exc:
                  print(name, type(exc).__name__)
          PY
