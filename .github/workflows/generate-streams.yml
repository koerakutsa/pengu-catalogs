name: Generate static streams and ERR DRM links

on:
  workflow_call:
    inputs:
      batch_size:
        type: string
        default: '4000'
      workers:
        type: string
        default: '6'
      prefer:
        type: string
        default: 'duoplay,err'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many missing stream IDs to resolve this run'
        required: false
        default: '4000'
      workers:
        description: 'Parallel workers'
        required: false
        default: '6'
      prefer:
        description: 'Priority order (duoplay,err)'
        required: false
        default: 'duoplay,err'
concurrency:
  group: pengu-repository-updates
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check DuoPlay stream mapping
        run: python -m unittest discover -s scripts -p 'test_streams.py'

      - name: Resolve playable streams and official ERR DRM links
        env:
          STREAM_BATCH_SIZE: ${{ inputs.batch_size }}
          STREAM_WORKERS: ${{ inputs.workers }}
          STREAM_PREFER: ${{ inputs.prefer }}
        run: python scripts/generate_streams.py

      - name: Remove rejected DuoPlay CDN headers and obsolete TV variants
        run: python scripts/normalize_duoplay_streams.py

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- stream stream-state.json
          if git diff --staged --quiet; then
            echo "No stream changes"
            exit 0
          fi
          COUNT=$(find stream -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "chore: stream batch progress (${COUNT} files)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Summary
        run: |
          echo "Stream files: $(find stream -name '*.json' | wc -l)"
          cat stream-state.json 2>/dev/null || true
