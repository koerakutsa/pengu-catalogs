name: Generate static streams (batch resume)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many missing stream IDs to resolve this run'
        required: false
        default: '8000'
      workers:
        description: 'Parallel workers'
        required: false
        default: '48'
      prefer:
        description: 'Priority order (err,duoplay)'
        required: false
        default: 'err,duoplay'
  schedule:
    - cron: '15 */2 * * *'

concurrency:
  group: generate-streams
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve one batch of missing streams
        env:
          STREAM_BATCH_SIZE: ${{ github.event.inputs.batch_size || '8000' }}
          STREAM_WORKERS: ${{ github.event.inputs.workers || '48' }}
          STREAM_PREFER: ${{ github.event.inputs.prefer || 'err,duoplay' }}
        run: python scripts/generate_streams.py

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stream stream-state.json || true
          if git diff --staged --quiet; then
            echo "No stream changes"
            exit 0
          fi
          COUNT=$(find stream -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "chore: stream batch progress (${COUNT} files)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "Stream files: $(find stream -name '*.json' | wc -l)"
          cat stream-state.json 2>/dev/null || true
