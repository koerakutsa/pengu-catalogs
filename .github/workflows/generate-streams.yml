name: Generate static streams (batch resume)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many missing stream IDs to resolve this run'
        required: false
        default: '4000'
      workers:
        description: 'Parallel workers'
        required: false
        default: '6'
      prefer:
        description: 'Priority order (duoplay,err)'
        required: false
        default: 'duoplay,err'
  schedule:
    - cron: '15 5 * * *'

concurrency:
  group: pengu-repository-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve one batch of missing streams
        env:
          STREAM_BATCH_SIZE: ${{ github.event.inputs.batch_size || '4000' }}
          STREAM_WORKERS: ${{ github.event.inputs.workers || '6' }}
          STREAM_PREFER: ${{ github.event.inputs.prefer || 'duoplay,err' }}
        run: python scripts/generate_streams.py

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- stream stream-state.json
          if git diff --staged --quiet; then
            echo "No stream changes"
            exit 0
          fi
          COUNT=$(find stream -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "chore: stream batch progress (${COUNT} files)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Summary
        run: |
          echo "Stream files: $(find stream -name '*.json' | wc -l)"
          cat stream-state.json 2>/dev/null || true
