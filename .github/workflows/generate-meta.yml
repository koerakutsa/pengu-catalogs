name: Generate static meta

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "scripts/generate_meta.py"

concurrency:
  group: generate-meta
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate meta JSON files (with series episodes)
        run: python scripts/generate_meta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          if git diff --staged --quiet; then
            echo "No meta changes"
            exit 0
          fi
          git commit -m "chore: regenerate static meta with series episodes"
          # main may have moved while generation ran (~1h)
          git pull --rebase origin main
          git push origin HEAD:main
