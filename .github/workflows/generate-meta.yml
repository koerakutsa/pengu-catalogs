name: Generate static meta

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "scripts/generate_meta.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate meta JSON files
        run: python scripts/generate_meta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          if git diff --staged --quiet; then
            echo "No meta changes"
          else
            git commit -m "chore: regenerate static meta from catalogs"
            git push
          fi
