name: Refresh Estonian catalogs and streams

on:
  workflow_call:
    inputs:
      metadata_limit:
        type: number
        default: 350
  workflow_dispatch:
    inputs:
      metadata_limit:
        description: 'Maximum number of artwork and description source IDs to refresh'
        required: false
        default: 350
        type: number
concurrency:
  group: pengu-repository-updates
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check metadata mapping
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh available films and series
        run: python scripts/refresh_catalogs.py
      - name: Refresh metadata and episode lists
        run: python scripts/generate_meta.py
      - name: Fill missing artwork and descriptions
        env:
          METADATA_LIMIT: ${{ inputs.metadata_limit }}
        run: python scripts/enrich_catalog_metadata.py --limit "$METADATA_LIMIT"
      - name: Commit catalog + meta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A catalog meta catalog-summary.json metadata-state.json
          if git diff --cached --quiet; then
            echo 'Catalogs current'
            exit 0
          fi
          git commit -m 'chore: refresh Estonian catalogs and metadata'
          git pull --rebase origin main
          git push origin HEAD:main
